name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: landing/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/midnight-bsh.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: midnight-bsh-apk
          path: landing/out/midnight-bsh.apk

      # Keep a stable download URL: the "apk" pre-release always holds the
      # latest build at .../releases/download/apk/midnight-bsh.apk
      - name: Publish to the rolling "apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Midnight BSH APK (latest build)
          prerelease: true
          files: landing/out/midnight-bsh.apk
          body: |
            Latest automated build of the Midnight BSH companion Android app,
            built from the `main` branch. This wraps the static landing page
            (see the GitHub Pages link in the repo) — the app itself needs to
            be self-hosted (Postgres + a Node server), see the README.

            **Install:** download midnight-bsh.apk and open it (allow installs
            from unknown sources when prompted). Signed with a test-only
            keystore committed to this repo, not a Play Store key.
